<aside class="sidebar">
  <div class="sidebar__logo">
    <svg width="42" height="42" viewBox="0 0 34 34" fill="none" aria-hidden="true">
      <path d="M17 0C7.61116 0 0 7.61116 0 17C0 26.3888 7.61116 34 17 34C26.3888 34 34 26.3888 34 17C34 7.61116 26.3888 0 17 0ZM17 31.1333C9.19177 31.1333 2.86667 24.8082 2.86667 17C2.86667 9.19177 9.19177 2.86667 17 2.86667C24.8082 2.86667 31.1333 9.19177 31.1333 17C31.1333 24.8082 24.8082 31.1333 17 31.1333Z" fill="var(--primary-color)"/>
      <path d="M17 8.5C12.3056 8.5 8.5 12.3056 8.5 17C8.5 21.6944 12.3056 25.5 17 25.5C21.6944 25.5 25.5 21.6944 25.5 17C25.5 12.3056 21.6944 8.5 17 8.5Z" fill="var(--primary-color)" fill-opacity="0.3"/>
    </svg>
    <span class="sidebar__logo-text" translate="no">Tik-Talk</span>
  </div>

  <nav class="sidebar__menu" aria-label="Основна навігація">
    @for (item of menuItems; track item.link) {
      <a
        [routerLink]="item.link"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        class="sidebar__menu-item"
      >
        @switch (item.icon) {
          @case ('profile') {
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.7-3.2 3.2-5 7-5s6.3 1.8 7 5"/></svg>
          }
          @case ('chats') {
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H6l-3 2v-9.5a7.5 7.5 0 1 1 17 0Z"/><path d="M8 11h.01M12 11h.01M16 11h.01"/></svg>
          }
          @case ('search') {
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg>
          }
        }
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="sidebar__footer">
    @if (currentUser(); as user) {
      <a class="sidebar__user" routerLink="/profile/me">
        <img
          [ngSrc]="user.avatarUrl || '/assets/imgs/img.png'"
          [alt]="'Аватар ' + user.displayName"
          width="50"
          height="50"
        >
        <span>
          <strong>{{ user.displayName }}</strong>
          <small>&#64;{{ user.username }}</small>
        </span>
      </a>
    }

    <button class="sidebar__logout" type="button" (click)="logout()">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"/></svg>
      <span>Вийти</span>
    </button>
  </div>
</aside>
